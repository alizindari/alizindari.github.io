<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" role="img" aria-labelledby="title desc">
  <title id="title">DISeL input-sensitive low-rank adaptation</title>
  <desc id="desc">Two inputs produce different rank gate patterns, followed by the factorization A G of x B x.</desc>
  <rect width="768" height="768" fill="#ffffff"/>

  <defs>
    <marker id="disel-arrow" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L13 6L1 11Z" fill="#182431"/>
    </marker>
    <style>
      .disel-label { font-family: Georgia, 'Times New Roman', serif; fill: #182431; }
      .disel-line { fill: none; stroke: #182431; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .disel-box { fill: #ffffff; stroke: #182431; stroke-width: 5; }
    </style>
  </defs>

  <g aria-label="input-dependent gate patterns">
    <circle cx="132" cy="118" r="25" fill="#e9f1f7" stroke="#182431" stroke-width="4"/>
    <text x="132" y="127" text-anchor="middle" class="disel-label" font-size="28" font-style="italic">x₁</text>
    <path d="M166 118H202" class="disel-line" marker-end="url(#disel-arrow)"/>
    <rect x="222" y="84" width="338" height="68" rx="12" fill="#f8fafc" stroke="#182431" stroke-width="4"/>
    <g fill="#dce3ea" stroke="#bdc8d2" stroke-width="2">
      <rect x="259" y="101" width="34" height="34" rx="5"/>
      <rect x="337" y="101" width="34" height="34" rx="5"/>
      <rect x="415" y="101" width="34" height="34" rx="5"/>
      <rect x="493" y="101" width="34" height="34" rx="5"/>
    </g>
    <text x="615" y="128" class="disel-label" font-size="31" font-style="italic">G(x₁)</text>

    <circle cx="132" cy="214" r="25" fill="#e5f5f1" stroke="#182431" stroke-width="4"/>
    <text x="132" y="223" text-anchor="middle" class="disel-label" font-size="28" font-style="italic">x₂</text>
    <path d="M166 214H202" class="disel-line" marker-end="url(#disel-arrow)"/>
    <rect x="222" y="180" width="338" height="68" rx="12" fill="#f8fafc" stroke="#182431" stroke-width="4"/>
    <g stroke-width="2">
      <rect x="259" y="197" width="34" height="34" rx="5" fill="#159987" stroke="#117a6c"/>
      <rect x="337" y="197" width="34" height="34" rx="5" fill="#159987" stroke="#117a6c"/>
      <rect x="415" y="197" width="34" height="34" rx="5" fill="#dce3ea" stroke="#bdc8d2"/>
      <rect x="493" y="197" width="34" height="34" rx="5" fill="#159987" stroke="#117a6c"/>
    </g>
    <text x="615" y="224" class="disel-label" font-size="31" font-style="italic">G(x₂)</text>
  </g>

  <path d="M390 266V306" class="disel-line" marker-end="url(#disel-arrow)"/>

  <g aria-label="DISeL factorization">
    <circle cx="66" cy="421" r="28" fill="#ffffff" stroke="#182431" stroke-width="5"/>
    <text x="66" y="431" text-anchor="middle" class="disel-label" font-size="32" font-style="italic">x</text>
    <path d="M101 421H126" class="disel-line" marker-end="url(#disel-arrow)"/>

    <g transform="translate(146 376)">
      <rect width="168" height="90" rx="8" fill="#214d73" stroke="#182431" stroke-width="5"/>
      <g fill="#dceaf4">
        <rect x="18" y="18" width="26" height="22" rx="3"/>
        <rect x="56" y="18" width="26" height="22" rx="3"/>
        <rect x="94" y="18" width="26" height="22" rx="3"/>
        <rect x="132" y="18" width="18" height="22" rx="3"/>
        <rect x="18" y="51" width="26" height="21" rx="3"/>
        <rect x="56" y="51" width="26" height="21" rx="3"/>
        <rect x="94" y="51" width="26" height="21" rx="3"/>
        <rect x="132" y="51" width="18" height="21" rx="3"/>
      </g>
      <text x="84" y="130" text-anchor="middle" class="disel-label" font-size="32" font-style="italic">B</text>
    </g>

    <path d="M324 421H345" class="disel-line" marker-end="url(#disel-arrow)"/>

    <g transform="translate(365 341)">
      <rect width="160" height="160" rx="8" class="disel-box"/>
      <g stroke-width="2">
        <rect x="18" y="18" width="32" height="32" rx="5" fill="#159987" stroke="#117a6c"/>
        <rect x="55" y="55" width="32" height="32" rx="5" fill="#159987" stroke="#117a6c"/>
        <rect x="92" y="92" width="32" height="32" rx="5" fill="#dce3ea" stroke="#bdc8d2"/>
        <rect x="129" y="129" width="18" height="18" rx="4" fill="#159987" stroke="#117a6c"/>
      </g>
      <g fill="#dce3ea">
        <circle cx="34" cy="71" r="3.5"/><circle cx="34" cy="108" r="3.5"/><circle cx="34" cy="140" r="3.5"/>
        <circle cx="71" cy="34" r="3.5"/><circle cx="71" cy="108" r="3.5"/><circle cx="71" cy="140" r="3.5"/>
        <circle cx="108" cy="34" r="3.5"/><circle cx="108" cy="71" r="3.5"/><circle cx="108" cy="140" r="3.5"/>
        <circle cx="140" cy="34" r="3.5"/><circle cx="140" cy="71" r="3.5"/><circle cx="140" cy="108" r="3.5"/>
      </g>
      <text x="80" y="204" text-anchor="middle" class="disel-label" font-size="32" font-style="italic">G(x)</text>
    </g>

    <path d="M535 421H554" class="disel-line" marker-end="url(#disel-arrow)"/>

    <g transform="translate(574 326)">
      <rect width="72" height="190" rx="8" fill="#159987" stroke="#182431" stroke-width="5"/>
      <g fill="#e2f5f1">
        <rect x="18" y="20" width="36" height="25" rx="3"/>
        <rect x="18" y="61" width="36" height="25" rx="3"/>
        <rect x="18" y="102" width="36" height="25" rx="3"/>
        <rect x="18" y="143" width="36" height="25" rx="3"/>
      </g>
      <text x="36" y="234" text-anchor="middle" class="disel-label" font-size="32" font-style="italic">A</text>
    </g>

    <path d="M656 421H681" class="disel-line" marker-end="url(#disel-arrow)"/>
    <circle cx="718" cy="421" r="28" fill="#e5f5f1" stroke="#182431" stroke-width="5"/>
    <text x="718" y="431" text-anchor="middle" class="disel-label" font-size="30" font-style="italic">f</text>
  </g>

  <text x="384" y="683" text-anchor="middle" class="disel-label" font-size="38" font-style="italic">f(x) = A G(x) B x</text>
</svg>
