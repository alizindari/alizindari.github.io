<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 416" role="img" aria-labelledby="title desc">
  <title id="title">Local SGD trajectories</title>
  <desc id="desc">Four local optimization paths diverge from a shared model and are averaged into a new shared model.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0b3b77" stroke-opacity=".055"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="720" height="416" fill="#fff"/>
  <rect x="24" y="24" width="672" height="368" rx="8" fill="#f8fafc" stroke="#dce4ee"/>
  <rect x="24" y="24" width="672" height="368" rx="8" fill="url(#grid)"/>

  <ellipse cx="602" cy="208" rx="68" ry="132" fill="none" stroke="#0b3b77" stroke-opacity=".08" stroke-width="2"/>
  <ellipse cx="602" cy="208" rx="45" ry="91" fill="none" stroke="#0b3b77" stroke-opacity=".11" stroke-width="2"/>
  <ellipse cx="602" cy="208" rx="23" ry="48" fill="none" stroke="#0b3b77" stroke-opacity=".15" stroke-width="2"/>

  <circle cx="92" cy="208" r="17" fill="#fff" stroke="#17384d" stroke-width="4"/>
  <circle cx="92" cy="208" r="5" fill="#17384d"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
    <path d="M110 202C174 184 223 104 362 102" stroke="#0b3b77"/>
    <path d="M110 206C188 203 246 159 362 164" stroke="#2a9d8f"/>
    <path d="M110 211C187 219 251 259 362 252" stroke="#d4a72c"/>
    <path d="M110 215C176 239 228 315 362 310" stroke="#df713f"/>
  </g>

  <g stroke="#fff" stroke-width="3">
    <g fill="#0b3b77"><circle cx="168" cy="174" r="7"/><circle cx="241" cy="126" r="7"/><circle cx="317" cy="104" r="7"/><circle cx="362" cy="102" r="9"/></g>
    <g fill="#2a9d8f"><circle cx="171" cy="196" r="7"/><circle cx="245" cy="169" r="7"/><circle cx="316" cy="163" r="7"/><circle cx="362" cy="164" r="9"/></g>
    <g fill="#d4a72c"><circle cx="171" cy="225" r="7"/><circle cx="247" cy="251" r="7"/><circle cx="317" cy="254" r="7"/><circle cx="362" cy="252" r="9"/></g>
    <g fill="#df713f"><circle cx="168" cy="246" r="7"/><circle cx="241" cy="294" r="7"/><circle cx="316" cy="311" r="7"/><circle cx="362" cy="310" r="9"/></g>
  </g>

  <g fill="none" stroke-linecap="round" stroke-width="3" marker-end="url(#arrow)">
    <path d="M377 102C452 104 499 160 574 198" stroke="#0b3b77"/>
    <path d="M377 164C456 165 506 191 574 203" stroke="#2a9d8f"/>
    <path d="M377 252C456 251 506 225 574 213" stroke="#d4a72c"/>
    <path d="M377 310C452 308 499 256 574 218" stroke="#df713f"/>
  </g>

  <circle cx="602" cy="208" r="18" fill="#fff" stroke="#17384d" stroke-width="4"/>
  <path d="m593 208 6 6 12-14" fill="none" stroke="#2a9d8f" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
</svg>
