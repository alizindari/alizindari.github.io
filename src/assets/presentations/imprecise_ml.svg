<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 416" role="img" aria-labelledby="title desc">
  <title id="title">Imprecise linear regression</title>
  <desc id="desc">Observed data is explained by a family of plausible regression lines inside an uncertainty band.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0b3b77" stroke-opacity=".055"/>
    </pattern>
    <clipPath id="plot"><rect x="82" y="62" width="560" height="292" rx="3"/></clipPath>
  </defs>
  <rect width="720" height="416" fill="#fff"/>
  <rect x="24" y="24" width="672" height="368" rx="8" fill="#f8fafc" stroke="#dce4ee"/>
  <rect x="24" y="24" width="672" height="368" rx="8" fill="url(#grid)"/>

  <g clip-path="url(#plot)">
    <path d="M70 332 654 70 654 122 70 360Z" fill="#2a9d8f" fill-opacity=".13"/>
    <path d="M70 346 654 92" fill="none" stroke="#0b3b77" stroke-linecap="round" stroke-width="5"/>
    <path d="M70 332 654 122" fill="none" stroke="#2a9d8f" stroke-linecap="round" stroke-width="4"/>
    <path d="M70 360 654 70" fill="none" stroke="#d4a72c" stroke-linecap="round" stroke-width="4"/>
  </g>

  <path d="M82 62V354H642" fill="none" stroke="#17384d" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
  <g stroke="#8aa0b5" stroke-linecap="round" stroke-width="3">
    <path d="M142 278V318M205 251V293M274 238V274M346 183V233M415 164V207M488 128V178M558 93V149"/>
  </g>
  <g fill="#fff" stroke="#17384d" stroke-width="4">
    <circle cx="142" cy="300" r="8"/><circle cx="205" cy="270" r="8"/><circle cx="274" cy="256" r="8"/><circle cx="346" cy="208" r="8"/><circle cx="415" cy="187" r="8"/><circle cx="488" cy="153" r="8"/><circle cx="558" cy="121" r="8"/>
  </g>
  <g fill="#2a9d8f">
    <circle cx="142" cy="300" r="3"/><circle cx="205" cy="270" r="3"/><circle cx="274" cy="256" r="3"/><circle cx="346" cy="208" r="3"/><circle cx="415" cy="187" r="3"/><circle cx="488" cy="153" r="3"/><circle cx="558" cy="121" r="3"/>
  </g>

</svg>
