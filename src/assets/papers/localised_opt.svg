  <title id="title">Hessian similarity and local quadratic approximation</title>
  <desc id="desc">Similar local Hessians above a smooth objective and its second-order Taylor approximation at x0. The curves agree in value, slope, and curvature at x0 and separate farther away.</desc>
  <metadata>The plotted objective is F(t)=0.0025 t^2+0.000000008 t^4 and its Taylor approximation is T2F(t)=0.0025 t^2 at t=0. SVG coordinates are x=384+t and y=610-F(t).</metadata>
