<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" role="img" aria-labelledby="title desc">
  <title id="title">Consensus error under second-order data heterogeneity</title>
  <desc id="desc">Nearly matching local Hessians above Local SGD trajectories that diverge during local updates and merge at synchronization rounds.</desc>
