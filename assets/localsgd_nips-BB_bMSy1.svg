<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" role="img" aria-labelledby="title desc">
  <title id="title">Local SGD: Hessian similarity and consensus error</title>
  <desc id="desc">Similar local Hessians H1, H2, and H3. Three workers start from a shared iterate, drift during local updates, and synchronize to their average. The vertical bracket highlights their disagreement before averaging.</desc>
  <defs>
    <style>.label { font-family: 'Times New Roman', Times, serif; fill: #182431; }</style>
  </defs>
  <rect width="768" height="768" fill="#fff"/>
  <g aria-label="similar local Hessians">
    <g transform="translate(110 64)">
      <rect width="132" height="132" rx="8" fill="#f8fafc" stroke="#182431" stroke-width="4"/>
      <rect x="16" y="16" width="30" height="30" rx="3" fill="#214d73"/>
      <rect x="51" y="16" width="30" height="30" rx="3" fill="#8fb5d0"/>
      <rect x="86" y="16" width="30" height="30" rx="3" fill="#dceaf4"/>
      <rect x="16" y="51" width="30" height="30" rx="3" fill="#8fb5d0"/>
      <rect x="51" y="51" width="30" height="30" rx="3" fill="#159987"/>
      <rect x="86" y="51" width="30" height="30" rx="3" fill="#8fb5d0"/>
      <rect x="16" y="86" width="30" height="30" rx="3" fill="#dceaf4"/>
      <rect x="51" y="86" width="30" height="30" rx="3" fill="#8fb5d0"/>
      <rect x="86" y="86" width="30" height="30" rx="3" fill="#214d73"/>
      <text x="66" y="181" text-anchor="middle" class="label" font-size="38" font-style="italic">H₁</text>
    </g>
    <g transform="translate(318 64)">
      <rect width="132" height="132" rx="8" fill="#f8fafc" stroke="#182431" stroke-width="4"/>
      <rect x="16" y="16" width="30" height="30" rx="3" fill="#214d73"/>
      <rect x="51" y="16" width="30" height="30" rx="3" fill="#86adc9"/>
      <rect x="86" y="16" width="30" height="30" rx="3" fill="#dceaf4"/>
